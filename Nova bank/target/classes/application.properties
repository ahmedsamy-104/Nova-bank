# ── Application ──────────────────────────────────────────────
spring.application.name=novabank-registration

# ── H2 File-mode datasource ──────────────────────────────────
spring.datasource.url=jdbc:h2:file:./data/novabank;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── JPA / Hibernate ──────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# ── H2 Console (OFF by default; enabled in dev profile) ──────
spring.h2.console.enabled=True
spring.h2.console.path=/h2-console

# ── Logging ──────────────────────────────────────────────────
logging.level.com.novabank=INFO
logging.level.org.springframework.security=WARN
spring.jpa.open-in-view=false